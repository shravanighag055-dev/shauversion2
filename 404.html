<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found | Shravani Ghag</title>
<link rel="icon" type="image/svg+xml" href="/portfolio/assets/img/favicon.svg" />
<style>
:root{--ink:#20211f;--accent:#4f6a4c;--soft:#e8eee4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbfaf7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center}
.card{max-width:460px;background:#fff;border:1px solid #e6e8e1;border-radius:28px;padding:44px 32px;box-shadow:0 12px 34px rgba(40,50,35,.07)}
.code{font-family:ui-serif,Georgia,serif;font-size:5rem;line-height:1;color:var(--accent);margin:0}
h1{font-size:1.5rem;margin:12px 0 8px;letter-spacing:-.02em}
p{color:#5f635e;margin:0 0 24px}
a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:650}
a:hover{background:var(--accent)}a:focus-visible{outline:3px solid #7da077;outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <p class="code" aria-hidden="true">404</p>
  <h1>This page doesn't exist</h1>
  <p>The link may be broken or the page may have moved. Let's get you back to the portfolio.</p>
  <a href="/portfolio/">Back to portfolio</a>
</main>
</body>
</html>
